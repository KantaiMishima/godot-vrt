name: VRT

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    uses: ./.github/workflows/vrt-linux.yml

  web:
    uses: ./.github/workflows/vrt-web.yml

  android:
    uses: ./.github/workflows/vrt-android.yml

  ios:
    uses: ./.github/workflows/vrt-ios.yml

  upload-to-argos:
    needs: [linux, web, android, ios]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all VRT screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: vrt-screenshots-*
          path: all_screenshots
        continue-on-error: true

      - name: List collected screenshots
        run: |
          echo "=== All collected screenshots ==="
          find all_screenshots -name "*.png" 2>/dev/null | sort
          COUNT=$(find all_screenshots -name "*.png" 2>/dev/null | wc -l)
          echo "Total: ${COUNT} screenshots"

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Upload screenshots to Argos
        run: |
          COUNT=$(find all_screenshots -name "*.png" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No screenshots found, skipping Argos upload"
            exit 0
          fi
          npm exec -- argos upload --token ${{ secrets.ARGOS_TOKEN }} ./all_screenshots
