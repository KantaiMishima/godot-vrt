name: VRT iOS

# NOTE: This workflow is provided as a reference example.
# iOS export requires a valid Apple Developer Team ID in export_presets.cfg.
# Currently disabled — remove `if: false` in the orchestrator (vrt.yml) once configured.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  capture-ios:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot and iOS export templates
        run: |
          RELEASE_TAG=$(curl -s "https://api.github.com/repos/godotengine/godot/releases/latest" | jq -r '.tag_name')
          VERSION="${RELEASE_TAG}"
          TEMPLATE_VERSION="${VERSION//-/.}"

          FILENAME="Godot_v${VERSION}_macos.universal"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}/${FILENAME}.zip"
          unzip -q "${FILENAME}.zip"
          GODOT_BIN="$(pwd)/Godot.app/Contents/MacOS/Godot"
          chmod +x "${GODOT_BIN}"
          echo "GODOT_BIN=${GODOT_BIN}" >> $GITHUB_ENV

          TEMPLATES_FILE="Godot_v${VERSION}_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}/${TEMPLATES_FILE}"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${TEMPLATE_VERSION}
          unzip -q "${TEMPLATES_FILE}" -d /tmp/templates
          mv /tmp/templates/templates/* ~/Library/Application\ Support/Godot/export_templates/${TEMPLATE_VERSION}/

      - name: Import project
        run: |
          timeout 120 "${GODOT_BIN}" --headless --editor --quit --path tests 2>&1 || true

      - name: Export iOS Xcode project
        run: |
          mkdir -p tests/build/ios
          "${GODOT_BIN}" --headless --path tests --export-release "iOS" build/ios/

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project tests/build/ios/vrt-tests.xcodeproj \
            -scheme vrt-tests \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15" 2>/dev/null || true

      - name: Install and run on Simulator
        run: |
          APP_PATH=$(find tests/build/ios/Build -name "*.app" -type d | head -1)
          xcrun simctl install booted "${APP_PATH}"
          xcrun simctl launch booted com.godot.vrt.tests

          for i in $(seq 1 120); do
            if xcrun simctl spawn booted log show --predicate 'process == "vrt-tests"' --last 5s 2>/dev/null | grep -q "=== Done ==="; then
              echo "VRT capture completed"
              break
            fi
            sleep 1
          done

      - name: Collect screenshots from Simulator
        run: |
          APP_DATA=$(xcrun simctl get_app_container booted com.godot.vrt.tests data 2>/dev/null || echo "")
          mkdir -p vr_screenshots_ios
          if [ -n "${APP_DATA}" ]; then
            find "${APP_DATA}" -name "*.png" -path "*/vr_screenshots/*" -exec cp {} ./vr_screenshots_ios/ \; 2>/dev/null || true
          fi
          ls -la ./vr_screenshots_ios/ 2>/dev/null || echo "No screenshots found"

      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-screenshots-ios
          path: vr_screenshots_ios/
          if-no-files-found: warn
